name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: HTTPS backend URL (optional; can also be set in the app)
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run android:sync
        env:
          PUBLIC_API_URL: ${{ inputs.backend_url }}
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Ballighni-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
